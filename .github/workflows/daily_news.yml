name: Daily Morning Digest

on:
  schedule:
    # JST 05:00 = UTC 20:00 (前日)
    - cron: '0 20 * * *'
  workflow_dispatch: # GitHub画面から手動テスト実行できるようにする設定

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai feedparser

      - name: ニュース送信スクリプトの実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
